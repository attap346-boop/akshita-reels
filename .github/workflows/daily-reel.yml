name: Daily reel

on:
  schedule:
    - cron: "30 0 * * *"   # 06:00 IST, one hour before the Instagram post goes out
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-freefont-ttf
          pip install --quiet pillow

      - name: Get royalty-free music (CC0)
        run: |
          D=$(date +%j)
          if [ $((10#$D % 2)) -eq 0 ]; then
            URL="https://opengameart.org/sites/default/files/yoiyami_core_theme_0.wav"
          else
            URL="https://opengameart.org/sites/default/files/the_budding_of_consciousness.wav"
          fi
          curl -fL -A "Mozilla/5.0" --retry 3 -o audio.wav "$URL" || ffmpeg -y -loglevel error -f lavfi -i "sine=f=220:d=40" -f lavfi -i "sine=f=261.63:d=40" -f lavfi -i "sine=f=329.63:d=40" -filter_complex "amix=inputs=3,volume=0.25,tremolo=f=0.2:d=0.4" audio.wav

      - name: Build reel
        run: python3 make_reel.py --audio audio.wav

      - name: Keep only the last 30 reels
        run: |
          ls reels/*.mp4 | head -n -30 | xargs -r rm
          ls reels/*.json | head -n -30 | xargs -r rm

      - name: Commit
        run: |
          git config user.name "reel-bot"
          git config user.email "reel-bot@users.noreply.github.com"
          git add reels
          git diff --cached --quiet || git commit -m "Reel $(date -u +%F)"
          git push
